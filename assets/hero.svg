<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Theio</title>
  <desc id="hero-desc">Ivory serif wordmark Theio with an amethyst geometric focal gesture on an obsidian field.</desc>
  <defs>
    <linearGradient id="bg-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070D"/>
      <stop offset="55%" stop-color="#120E1D"/>
      <stop offset="100%" stop-color="#07060B"/>
    </linearGradient>
    <linearGradient id="ivory-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4EFFB"/>
      <stop offset="100%" stop-color="#DDD5E8"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="80%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="focal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08070D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 黑曜底板与边界 -->
  <rect width="1200" height="380" rx="14" fill="url(#bg-plate)"/>
  <rect x="1" y="1" width="1198" height="378" rx="13" fill="none" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1"/>

  <!-- 几何焦点的紫晶光晕 -->
  <circle cx="920" cy="190" r="170" fill="url(#focal-glow)"/>

  <!-- 贝塞尔曲线与透镜构图 -->
  <g id="gesture">
    <!-- 水平参考线 -->
    <line x1="680" y1="190" x2="1140" y2="190" stroke="#715C88" stroke-opacity="0.28" stroke-width="1"/>
    
    <!-- 保留手机缩放后的主曲线厚度 -->
    <path d="M 680 305 C 820 305, 870 75, 1120 75" fill="none" stroke="url(#curve-grad)" stroke-width="4"/>

    <!-- 控制柄与锚点 -->
    <line x1="680" y1="305" x2="820" y2="305" stroke="#9333EA" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="870" y1="75" x2="1120" y2="75" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 4"/>
    
    <circle cx="820" cy="305" r="4" fill="#9333EA"/>
    <circle cx="870" cy="75" r="4" fill="#DDD6FE"/>
    
    <!-- 焦点圆环 -->
    <circle cx="920" cy="190" r="84" fill="none" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="920" cy="190" r="42" fill="none" stroke="#C084FC" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 5"/>
    <circle cx="920" cy="190" r="4" fill="#E9D5FF"/>
    <circle cx="920" cy="190" r="1.5" fill="#FFFFFF"/>
    
    <!-- 透镜中轴 -->
    <line x1="920" y1="120" x2="920" y2="260" stroke="#715C88" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <!-- Bodoni Moda 字形转轮廓，避免不同系统字体回退改变构图 -->
